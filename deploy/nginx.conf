# 言喵后端 Nginx 配置
# 放置位置：/etc/nginx/conf.d/yanmiao.conf
# 生产域名：api.missmeow.net；证书路径按服务器实际证书文件调整
#
# 关键点：
# 1. 小程序只允许 https + 443 端口，不支持自定义端口号
# 2. 图片走 COS 直传，所以这里的 client_max_body_size 保持很小
# 3. 服务只监听 127.0.0.1:3000，公网不可直达

limit_req_zone $binary_remote_addr zone=yanmiao_api:10m rate=20r/s;

server {
    listen 80;
    server_name api.missmeow.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.missmeow.net;

    ssl_certificate     /etc/nginx/ssl/api.missmeow.net_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.missmeow.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 请求体极小（只传 JSON），图片不经过这里
    client_max_body_size 1m;
    client_body_timeout  15s;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    access_log /var/log/nginx/yanmiao.access.log;
    error_log  /var/log/nginx/yanmiao.error.log warn;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3000/healthz;
    }

    # 同步调用上游大模型或远程素材导入的接口耗时可能超过 30 秒，单独放宽读取超时
    location ~ ^/v1/(chats|transcriptions|uploads/import-static)(/|$) {
        limit_req zone=yanmiao_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    90s;
    }

    location / {
        limit_req zone=yanmiao_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 生成接口是提交即返回，不需要长连接等待
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
